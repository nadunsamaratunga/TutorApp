# TutorApp database configuration
#
# TutorApp works perfectly fine with these settings absent or wrong - it
# just runs entirely in-memory (as before) and prints one warning line at
# startup instead of connecting. Fill these in once you have MySQL/MariaDB
# running with database/schema.sql imported, and the app will start
# mirroring every create/update into it automatically.
#
# Defaults below match a stock XAMPP MySQL install (root user, no password).

db.enabled=true
db.url=jdbc:mysql://localhost:3306/tutorapp
db.user=root
db.password=
